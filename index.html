<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EnorCraft | Minecraft Sunucusu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
    }

    header {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at top, #25204a, #080b12 60%);
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .logo {
      font-size: 55px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .logo span {
      color: #9b5cff;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #b9bdc9;
      font-size: 17px;
      line-height: 1.6;
    }

    .ip {
      display: inline-block;
      margin: 25px 0;
      padding: 15px 25px;
      border: 1px solid #9b5cff;
      border-radius: 12px;
      background: rgba(155, 92, 255, 0.1);
      font-size: 18px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      text-decoration: none;
      color: white;
      background: #9b5cff;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #b17aff;
    }

    .button.dark {
      background: #171b26;
      border: 1px solid #303746;
    }

    section {
      padding: 70px 20px;
      text-align: center;
      background: #0c1018;
    }

    .cards {
      max-width: 1000px;
      margin: 35px auto 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      padding: 30px;
      border-radius: 16px;
      background: #121722;
      border: 1px solid #242b3a;
    }

    .card h3 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #9b5cff;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #777f91;
      background: #070910;
    }

    @media (max-width: 650px) {
      .logo {
        font-size: 42px;
      }

      h2 {
        font-size: 23px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">

      <div class="logo">
        ENOR<span>CRAFT</span>
      </div>

      <h2>Minecraft'ın Yeni Macerasına Hazır mısın?</h2>

      <p>
        EnorCraft'a katıl, arkadaşlarınla birlikte savaş,
        geliş ve zirveye ulaş!
      </p>

      <div class="ip">
        🎮 Sunucu IP: Yakında
      </div>

      <div class="buttons">
        <a href="#" class="button">⚔️ Oyunlara Katıl</a>
        <a href="#" class="button dark">💬 Discord</a>
      </div>

    </div>
  </header>

  <section>

    <h2>Oyun Modlarımız</h2>
